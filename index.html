<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapsül</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111113;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #2997ff;
            --accent-hover: #0077ED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        p.subtitle {
            font-size: 19px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: -0.009em;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            margin-bottom: 24px;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        textarea {
            width: 100%;
            height: 140px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 17px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .counter {
            font-size: 13px;
            color: var(--text-secondary);
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #e8e8ed;
        }

        button:active {
            transform: scale(0.97);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid rgba(41, 151, 255, 0.3);
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .secondary-btn:hover {
            background-color: rgba(41, 151, 255, 0.08);
            border-color: var(--accent);
        }

        /* Gelen Mesaj Alanı */
        #whisper-display {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-primary);
            padding: 10px;
            font-style: italic;
        }

        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            background: #333336;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="fade-in">
            <h1>Kapsül.</h1>
            <p class="subtitle">Evrene bırakılan anonim fısıltılar.</p>
        </header>

        <!-- Mesaj Yazma Kartı -->
        <div class="card fade-in">
            <textarea id="messageInput" maxlength="280" placeholder="İçinde kalan, kimseye söyleyemediğin o şeyi yaz..."></textarea>
            <div class="actions">
                <span class="counter"><span id="charCount">0</span>/280</span>
                <button onclick="saveMessage()">Evrene Bırak</button>
            </div>
        </div>

        <!-- Mesaj Okuma Kartı -->
        <div class="card fade-in" style="margin-top: 12px;">
            <div id="whisper-display">"Geçmişteki bana: Beklediğinden çok daha güçlüsün."</div>
            <button class="secondary-btn" onclick="getRandomWhisper()">Başka Bir Yabancının Fısıltısını Dinle</button>
        </div>
    </div>

    <footer class="fade-in">
        <p>Gizlilik esastır. Kimlikler saklanmaz, kelimeler zamana bırakılır.</p>
    </footer>

    <div id="toast" class="toast">Kapsül başarıyla boşluğa fırlatıldı.</div>

    <script>
        // Varsayılan havuz
        const defaultWhispers = [
            "10 yıl önce lisede arkasından baktığım o kız, umarım çok mutlusundur.",
            "Gelecekteki ben, umarım o arabayı almışsındır ve hala kahveyi sert seviyorsundur.",
            "Bugün hayatımın en kötü günü gibi hissediyorum ama yarın ne olacağını kim bilebilir ki?",
            "Ankeme teşekkür edemeden şehirden taşınmak içimde kalan tek ukte.",
            "Belki de yalnızlık, kendi iç sesinle tanışmak için evrenin verdiği bir moladır."
        ];

        // LocalStorage'dan veya varsayılandan mesajları al
        function getMessages() {
            const custom = JSON.parse(localStorage.getItem('user_capsules')) || [];
            return [...defaultWhispers, ...custom];
        }

        // Karakter sayacı
        const textarea = document.getElementById('messageInput');
        const charCount = document.getElementById('charCount');

        textarea.addEventListener('input', () => {
            charCount.textContent = textarea.value.length;
        });

        // Mesaj kaydetme
        function saveMessage() {
            const text = textarea.value.trim();
            if(text.length < 3) {
                showToast("Lütfen anlamlı birkaç kelime yaz.");
                return;
            }

            const custom = JSON.parse(localStorage.getItem('user_capsules')) || [];
            custom.push(text);
            localStorage.setItem('user_capsules', JSON.stringify(custom));

            textarea.value = '';
            charCount.textContent = '0';
            showToast("Kapsül başarıyla boşluğa fırlatıldı.");
        }

        // Rastgele mesaj çekme
        function getRandomWhisper() {
            const messages = getMessages();
            const display = document.getElementById('whisper-display');
            
            // Animasyon efekti
            display.style.opacity = 0;
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * messages.length);
                display.textContent = `"${messages[randomIndex]}"`;
                display.style.opacity = 1;
            }, 200);
        }

        // Toast bildirimi
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
